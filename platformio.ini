; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

[env]
extra_scripts =
	pre:apply_patches.py
	extra_script.py
lib_deps =
	adafruit/Adafruit GFX Library
	olikraus/U8g2_for_Adafruit_GFX
	zinggjm/GxEPD2
	https://github.com/ricmoo/QRCode.git
	bblanchon/ArduinoJson@^6.21.5
	https://github.com/tignioj/ArduinoUZlib.git
monitor_speed = 115200

[env:emulator]
extra_scripts =
	${env.extra_scripts}
	post:copy_emulator_dlls.py
platform = native
lib_compat_mode = off
lib_deps =
	${env.lib_deps}
	; skaygin/ArduinoNative ; Use the local version of ArduinoNative
	noah1510/Native SPI
build_flags = -std=c17 -DNATIVE -DARDUINO_ARCH_NATIVE -DARDUINO=100 -Dunix -DSILENT_SPI
	-Ithird_party/sdl3/SDL3-3.4.0/x86_64-w64-mingw32/include
	-Ithird_party/curl/curl-8.19.0_8-win64-mingw/include
	-Lthird_party/sdl3/SDL3-3.4.0/x86_64-w64-mingw32/lib
	-Lthird_party/curl/curl-8.19.0_8-win64-mingw/lib
	-lSDL3
	-lcurl

; 微雪 7.5 V2 黑白墨水屏 (800x480) PC 模拟器 (与真机同用 GDEY075T7/UC8179 驱动)
[env:emulator-750]
extends = env:emulator
build_flags =
	${env:emulator.build_flags}
	-DEPD_TYPE=GxEPD2_BW
	-DEPD_DRIVER=GxEPD2_750_GDEY075T7
	-DEMULATOR_SCALE=1
	-DEPD_ROTATION=1

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps =
	${env.lib_deps}
	jwrw/ESP_EEPROM
board_build.ldscript = eagle.flash.2m.ld

[env:smpl-v2-0213-1] ; 第一批送出去的墨水屏
extends = env:esp12e
build_flags = -DBOARD_SMPL_V2 -DMODEL=\"SMPL_V2_0213_1\" -DEPD_TYPE=GxEPD2_3C -DEPD_DRIVER=GxEPD2_213_EXT3

[env:smpl-v2-0213-2] ; 第二批送出去的墨水屏
extends = env:esp12e
build_flags = -DBOARD_SMPL_V2 -DMODEL=\"SMPL_V2_0213_2\" -DEPD_TYPE=GxEPD2_BW -DEPD_DRIVER=GxEPD2_213_A07

[env:coreboard-v1-2] ; 自己画的开发板
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags = -DBOARD_COREBOARD_V1 -DMODEL=\"CoreBoard_ESP32_V1.2\"

; 微雪 e-Paper ESP32 Driver Board Rev3 (ESP32-WROOM-32E) + 7.5 V2 墨水屏 真机环境
[env:esp32-waveshare-750]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
	-DBOARD_WAVESHARE_DRIVER_REV3
	-DMODEL=\"Waveshare_750_V2\"
	-DEPD_TYPE=GxEPD2_BW
	-DEPD_DRIVER=GxEPD2_750_GDEY075T7
monitor_speed = 115200
board_build.partitions = rainmaker.csv # no_fs.csv
